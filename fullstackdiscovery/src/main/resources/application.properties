server.port=8010 # This is the port the application will start up on
spring.application.name=discoveryservice # The name of the application that we can use to connect to other spring applications
eureka.instance.hostname=localhost # Defining the application on localhost
eureka.client.register-with-eureka=false # This is the server so it doesn't need to register with itself
eureka.client.service-url.defaultZone=http://${eureka.instance.hostname}:${server.port}/eureka # The URI the clients need to find to connect to the server