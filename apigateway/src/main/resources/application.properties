server.port=8082
spring.application.name=api-gateway
eureka.client.service-url.defaultZone=http://localhost:8010/eureka

spring.cloud.gateway.server.webflux.routes[0].id=users-status-check
spring.cloud.gateway.server.webflux.routes[0].uri=lb://users-ws
# predicates are like if statments where they have to pass in order to run
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users-ws/users/status/check
spring.cloud.gateway.server.webflux.routes[0].predicates[1]=Method=GET
spring.cloud.gateway.server.webflux.routes[0].predicates[2]=Header=Authorization, Bearer (.*)
spring.cloud.gateway.server.webflux.routes[0].filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.server.webflux.routes[0].filters[1]=RewritePath=/users-ws/(?<segment>.*), /$\{segment}

spring.cloud.gateway.server.webflux.routes[1].id=users-ws-login
spring.cloud.gateway.server.webflux.routes[1].uri=lb://users-ws
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users-ws/users/login
spring.cloud.gateway.server.webflux.routes[1].predicates[1]=Method=Post
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RemoveRequestHeader=Cookie
#spring.cloud.gateway.server.webflux.routes[0].filters[1]=RewritePath=/users-ws/(?<segment>.*), /$\{segment}

